kind = "web"
previewPath = "/"
title = "BTC VPN Dashboard"
version = "1.0.0"
id = "artifacts/btc-vpn-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18358

[services.development]
run = "pnpm --filter @workspace/btc-vpn-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/btc-vpn-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/btc-vpn-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18358"
BASE_PATH = "/"
